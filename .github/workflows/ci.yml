name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build et tests (JaCoCo)
        run: ./mvnw -B install
      - name: Tests par mutation (PIT)
        run: ./mvnw -B org.pitest:pitest-maven:mutationCoverage
