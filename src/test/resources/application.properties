spring.application.name=pokemon-management-api

# Tests : H2 en mémoire, recréée à chaque lancement
spring.datasource.url=jdbc:h2:mem:pokemon;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
# data.sql après la création des tables par Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Même réglage que l'application (ce fichier masque celui de main)
spring.jpa.open-in-view=false
